# Arquivo principal que puxa todas as tasks subsequêntes.
# (1) Executar preparação antes da instalação:
- name: "(1) PREPARAÇÃO:"
  include_tasks: prep.yml
#eol

# (2) Executar configurações de armazenamento:
- name: "(2) ARMAZENAMENTO:"
  include_tasks: storage.yml
#eol

# (3) Executar montagem das partições:
- name: "(3) MONTAGEM:"
  include_tasks: mount.yml
#eol

# (4) Executar instalação via bootstrap:
- name: "(4) BOOTSTRAP:"
  include_tasks: bootstrap.yml
#eol

# (5) Executar preparações pré-chroot:
- name: "(5) PREPARAÇÃO DO CHROOT:"
  include_tasks: chroot_prep.yml
#eol
