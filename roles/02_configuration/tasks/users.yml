---
#
#
#

# Agrupa todas as definições de usuários do sistema.
# (1) Definir senha do usuário root:
- name: "(1) DEFININDO O USUÁRIO ROOT..."
  user:
    name: root
    password: "{{ passwd_root_hash }}"
  #eol
#eol
# (2) Definir usuário normal:
- name: "(2) DEFININDO O USUÁRIO NORMAL..."
  user:
    name: "{{ user_name }}"
    groups: wheel,users
    shell: "{{ chroot_dir }}/bin/bash"
    create_home: true
    password: "{{ passwd_user_hash }}"
  #eol
#eol
# (3) Definir configuração do doas (elevador de previlégios):
- name: "(3) DEFININDO CONFIGURAÇÃO DO DOAS..."
  copy:
    dest: "{{ chroot_dir }}/etc/doas.conf"
    owner: root
    group: root
    mode: "0400"
    content: "permit persist :wheel\n"
  #eol
#eol
